name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bio-compass/pkb-service
  SERVICE_NAME: pkb-service
  HELM_VALUES_REPOSITORY: ${{ vars.PKB_SERVICE_HELM_VALUES_REPOSITORY || 'Bio-Compass/bio-compass-helm' }}
  HELM_VALUES_REF: ${{ vars.PKB_SERVICE_HELM_VALUES_REF || 'main' }}

jobs:
  test:
    name: Gradle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon

  e2e-test:
    name: Local Service E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Start local dependencies
        run: docker compose --env-file .env up -d --wait

      - name: Start local PKB service
        run: |
          mkdir -p build/e2e
          set -a
          source .env
          set +a
          ./gradlew bootRun --args='--spring.profiles.active=local' --no-daemon > build/e2e/pkb-service.log 2>&1 &
          echo "$!" > build/e2e/pkb-service.pid

      - name: Wait for local PKB service
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done

          echo "PKB service did not become healthy in time." >&2
          cat build/e2e/pkb-service.log >&2
          exit 1

      - name: Run E2E tests
        run: ./gradlew e2eTest --no-daemon

      - name: Stop local PKB service
        if: always()
        run: |
          if [ -f build/e2e/pkb-service.pid ]; then
            kill "$(cat build/e2e/pkb-service.pid)" || true
          fi

      - name: Stop local dependencies
        if: always()
        run: docker compose --env-file .env down -v

      - name: Upload PKB service log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pkb-service-e2e-log
          path: build/e2e/pkb-service.log
          if-no-files-found: ignore

  publish-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test
      - e2e-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-ref: ${{ steps.digest.outputs.ref }}
      helm-revision: ${{ steps.helm-revision.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        run: |
          image_tag="$(./gradlew -q printContainerImageTag)"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        run: |
          ./gradlew jibDockerBuild --no-daemon -PcontainerImage="${IMAGE_NAME}"
          docker push "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Resolve immutable image digest
        id: digest
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_digest="$(docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{index .RepoDigests 0}}')"
          [[ "${image_digest}" =~ ^${IMAGE_NAME}@sha256:[a-f0-9]{64}$ ]]
          echo "ref=${IMAGE_TAG}@${image_digest#*@}" >> "${GITHUB_OUTPUT}"

      - name: Pin Helm source and environment values
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HELM_VALUES_REPOSITORY }}
          ref: ${{ env.HELM_VALUES_REF }}
          path: helm-source
          ssh-key: ${{ secrets.BIO_COMPASS_HELM_VALUES_SSH_KEY }}
          persist-credentials: false

      - name: Record Helm revision
        id: helm-revision
        run: echo "sha=$(git -C helm-source rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-testing:
    name: Deploy to testing
    needs: publish-image
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: testing
      image-ref: ${{ needs.publish-image.outputs.image-ref }}
      helm-revision: ${{ needs.publish-image.outputs.helm-revision }}
    secrets: inherit

  e2e-testing:
    name: E2E against deployed testing service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-testing
    environment: testing
    env:
      KUBECONFIG: /home/runner/.kube/pkb-ci-config
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
      - name: Configure testing credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          mkdir -p "$(dirname "${KUBECONFIG}")"
          test -n "${KUBE_CONFIG}"
          printf '%s' "${KUBE_CONFIG}" > "${KUBECONFIG}"
      - name: Test deployed API through namespace-scoped port forwards
        env:
          PKB_E2E_USERNAME: ${{ secrets.PKB_E2E_USERNAME }}
          PKB_E2E_PASSWORD: ${{ secrets.PKB_E2E_PASSWORD }}
          PKB_E2E_BASE_URL: http://127.0.0.1:18080
          PKB_E2E_AUTH_URL: http://127.0.0.1:18081
          PKB_E2E_NAMESPACE: testing
        run: |
          kubectl -n testing port-forward --address 127.0.0.1 service/pkb-service 18080:80 > "${RUNNER_TEMP}/pkb-forward.log" 2>&1 &
          pkb_pid=$!
          kubectl -n testing port-forward --address 127.0.0.1 service/bio-compass-auth 18081:80 > "${RUNNER_TEMP}/bas-forward.log" 2>&1 &
          bas_pid=$!
          trap 'kill "${pkb_pid}" "${bas_pid}" 2>/dev/null || true' EXIT
          python3 .github/scripts/deployed-e2e.py
      - name: Remove Kubernetes credentials
        if: always()
        run: rm -f "${KUBECONFIG}"

  deploy-prod:
    name: Promote tested image to production
    needs:
      - publish-image
      - e2e-testing
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      image-ref: ${{ needs.publish-image.outputs.image-ref }}
      helm-revision: ${{ needs.publish-image.outputs.helm-revision }}
    secrets: inherit
