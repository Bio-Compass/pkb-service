apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: testing
  labels:
    app.kubernetes.io/name: pkb-e2e
  annotations:
    biocompass.help/source-revision: ${SOURCE_REVISION}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pkb-e2e
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tests
          image: ${RUNNER_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: PKB_E2E_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PKB_E2E_ACCESS_MODE
              value: cluster
            - name: PKB_E2E_BASE_URL
              value: http://pkb-service
            - name: PKB_E2E_AUTH_URL
              value: http://bio-compass-auth
            - name: PKB_E2E_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${JOB_NAME}-credentials
                  key: username
            - name: PKB_E2E_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${JOB_NAME}-credentials
                  key: password
          volumeMounts:
            - name: reports
              mountPath: /reports
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: reports
          emptyDir: {}
        - name: temporary
          emptyDir: {}
